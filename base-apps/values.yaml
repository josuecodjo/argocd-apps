---
# =============================================================================
# base-apps - CATALOG
# =============================================================================
# This file is the single source of truth for *what* each platform component is:
# its chart repository, version, target namespace and sync quirks.
#
# Per-environment files (values-dev.yaml, values-qa.yaml, values-prod.yaml)
# contain ONLY the differences - in practice just `enabled` toggles. They are
# layered on top of this file:
#
#   helm template base-apps -f base-apps/values.yaml -f base-apps/values-dev.yaml
#
# Helm deep-merges maps, so `charts.kyverno.enabled: true` in an overlay keeps
# the `helm` and `namespace` keys defined here.
#
# CAVEAT: Helm *replaces* lists wholesale. To pin a different version in one
# environment you must restate the whole `helm:` entry in that overlay, e.g.
#
#   charts:
#     kyverno:
#       helm:
#         - repoURL: https://kyverno.github.io/kyverno
#           targetRevision: 3.7.0
#
# Per-app keys understood by templates/charts.yaml:
#   enabled           (bool)  render this Application at all
#   helm              (list)  one entry per source: repoURL + targetRevision,
#                             or `localChart: true` for a chart in app_charts/
#   namespace         (str)   destination namespace      [default: dest_namespace]
#   project           (str)   Argo CD AppProject         [default: dest_project]
#   chartName         (str)   chart + app_charts/ dir    [default: the key]
#   serverSideApply   (bool)  adds ServerSideApply=true (needed for big CRDs)
#   autosync_enabled  (bool)  set false to drop syncPolicy entirely
#   extraValues       (map)   inline values merged over app_charts, verbatim
#   templatedValues   (map)   same, but rendered with `tpl` first - use this for
#                             {{ .Values.global.dnsName }}
#   wave              (int)   argocd.argoproj.io/sync-wave on the Application.
#                             Lower waves sync first and must go Healthy before
#                             the next wave starts. See the wave map below.
#
# OCI-HOSTED CHARTS (kro, Kargo): use the BARE host, with no `oci://` scheme.
# Argo CD has two modes here. A bare host plus `chart` is "Helm chart in an OCI
# registry" and resolves as <repoURL>/<chart>:<targetRevision>. Adding `oci://`
# switches it to OCI-artifact mode, where repoURL is the COMPLETE reference and
# `chart` is ignored - which yields 403/not-found errors like
#   failed to resolve revision "1.12.5": ghcr.io/akuity/kargo-charts:1.12.5
# because the chart segment never gets appended. Verified on Argo CD v3.6.1.
#
# WAVE MAP
#   0  CRD installers            external-secrets, kyverno, kro,
#                                vault-secrets-operator
#   1  need wave-0 CRDs          kube-prometheus-stack, policy-reporter, kargo,
#                                argo-rollouts
#   2  workloads and CRs         php-apache, ghost, kyverno-policy,
#                                monitoring-extras
#   3  vault                     LAST on purpose: the chart's readiness probe is
#                                `vault status`, which fails while Vault is
#                                sealed or uninitialised. A not-Ready pod never
#                                goes Healthy, and Argo CD will not start the
#                                next wave until the current one is - so Vault
#                                in an early wave would stall the whole
#                                bootstrap behind a human unseal step.
#   4  vault-demo                needs Vault initialised; autosync is off
# =============================================================================

argocd_namespace: argocd
dest_project: tools
dest_namespace: tools

# --- per-cluster identity -----------------------------------------------------
# These two are what make one catalog serve several clusters from a single hub.
#
# appNameSuffix is appended to every generated Application name. It MUST stay ""
# for the hub cluster: changing it renames the running Applications, which makes
# Argo CD delete and recreate every component. Spokes set it (e.g. "-dev") so
# their Applications do not collide with the hub's - both render into the hub's
# single argocd namespace, so without a suffix two root apps would fight over an
# Application called `kyverno`, `vault`, `kargo`...
appNameSuffix: ""

# Identifies this cluster in metrics. Becomes Prometheus' `cluster` external
# label, which the stock kube-prometheus-stack dashboards filter on (they carry
# 61 `cluster=` selectors), so every cluster needs a distinct value.
clusterName: prod

# Ingress suffix for every component that exposes a UI. Overridden at bootstrap
# time by Ansible, which passes its own `global_dns_name` as a Helm parameter, so
# this value and the Argo CD host always come from the same variable.
# Referenced from `templatedValues` entries below as {{ .Values.global.dnsName }}.
global:
  dnsName: home.lab

spec:
  destination:
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/josuecodjo/argocd-apps.git
    targetRevision: HEAD

charts:
  # ----------------------------------
  # Category: Security & Policy
  # ----------------------------------

  # Manages secrets from external providers (e.g., AWS Secrets Manager, Vault)
  # and syncs them into Kubernetes Secrets.
  external-secrets:
    enabled: false
    wave: 0
    namespace: external-secrets
    helm:
      - repoURL: https://charts.external-secrets.io
        targetRevision: 0.14.3

  # A policy engine for Kubernetes to validate, mutate, and generate resource
  # configurations, enforcing security and best practices.
  kyverno:
    enabled: false
    wave: 0
    namespace: kyverno
    serverSideApply: true
    helm:
      - repoURL: https://kyverno.github.io/kyverno
        targetRevision: 3.8.1

  # Dashboard and reporting for Kyverno PolicyReports.
  policy-reporter:
    enabled: false
    wave: 1
    namespace: policy-reporter
    helm:
      - repoURL: https://kyverno.github.io/policy-reporter
        targetRevision: 3.7.4
    templatedValues:
      ui:
        ingress:
          hosts:
            - host: "kyverno.{{ .Values.global.dnsName }}"
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: kyverno-tls
              hosts:
                - "kyverno.{{ .Values.global.dnsName }}"

  # A runtime security tool that detects and alerts on anomalous
  # behavior or threats inside containers and on the host.
  falco:
    enabled: false
    wave: 1
    namespace: falco
    helm:
      - repoURL: https://falcosecurity.github.io/charts
        targetRevision: 6.0.2

  # An open-source Identity and Access Management (IAM) solution for
  # features like Single Sign-On (SSO).
  keycloak:
    enabled: false
    wave: 1
    namespace: keycloak
    helm:
      - repoURL: https://charts.bitnami.com/bitnami
        targetRevision: 24.7.4
    templatedValues:
      ingress:
        hostname: "keycloak.{{ .Values.global.dnsName }}"
        extraTls:
          - hosts:
              - "keycloak.{{ .Values.global.dnsName }}"
            secretName: keycloak-tls

  # ----------------------------------
  # Category: CI/CD & Deployment
  # ----------------------------------

  # Provides advanced deployment strategies like Canary and Blue-Green
  # releases for safer, controlled application updates.
  argo-rollouts:
    enabled: true
    wave: 1
    namespace: argo-rollouts
    helm:
      - repoURL: https://argoproj.github.io/argo-helm
        targetRevision: 2.43.11
    templatedValues:
      dashboard:
        ingress:
          hosts:
            - "rollouts.{{ .Values.global.dnsName }}"
          tls:
            - secretName: argo-rollouts-tls
              hosts:
                - "rollouts.{{ .Values.global.dnsName }}"

  # ----------------------------------
  # Category: Cost & Resource Optimization
  # ----------------------------------

  # Reduces cloud costs by automatically shutting down resources in
  # non-production environments during off-hours.
  kube-green:
    enabled: false
    wave: 1
    namespace: kube-green
    helm:
      - repoURL: https://kube-green.github.io/helm-charts
        targetRevision: 0.6.0

  # ----------------------------------
  # Category: Observability & Management
  # ----------------------------------

  # The official general-purpose, web-based UI for Kubernetes clusters.
  # Wrapper chart in app_charts/ that adds a read-only user + RBAC, so it
  # tracks this repo's revision rather than an upstream chart version.
  kubernetes-dashboard:
    enabled: false
    wave: 1
    namespace: kubernetes-dashboard
    helm:
      - localChart: true

  kube-prometheus-stack:
    enabled: true
    wave: 1
    namespace: monitoring
    serverSideApply: true
    helm:
      - repoURL: https://prometheus-community.github.io/helm-charts
        targetRevision: 77.12.0
    templatedValues:
      prometheus:
        prometheusSpec:
          externalLabels:
            cluster: "{{ .Values.clusterName }}"
      grafana:
        ingress:
          hosts:
            - "grafana.{{ .Values.global.dnsName }}"
          tls:
            - secretName: grafana-tls
              hosts:
                - "grafana.{{ .Values.global.dnsName }}"

  # ----------------------------------
  # Category: CRDs and abstraction
  # ----------------------------------

  kro:
    enabled: true
    wave: 0
    namespace: kro
    helm:
      - repoURL: registry.k8s.io/kro/charts
        targetRevision: 0.10.0

  # ----------------------------------
  # Category: Application Promotion
  # ----------------------------------

  kargo:
    enabled: true
    wave: 1
    namespace: kargo
    helm:
      - repoURL: ghcr.io/akuity/kargo-charts
        targetRevision: 1.12.5
    templatedValues:
      api:
        host: "kargo.{{ .Values.global.dnsName }}"

  # ----------------------------------
  # Category: Secrets management
  # ----------------------------------

  # HashiCorp Vault, standalone with file storage on a local-path PVC.
  #
  # Wave 3 (last) is deliberate: the chart's readiness probe is `vault status`,
  # which exits non-zero while Vault is sealed or uninitialised, so the pod is
  # never Ready and this Application never goes Healthy until a human runs
  # `vault operator init` + `unseal`. In an earlier wave that would stall every
  # later wave. See the runbook in myLab/README.md.
  vault:
    enabled: true
    wave: 3
    namespace: vault
    helm:
      - repoURL: https://helm.releases.hashicorp.com
        targetRevision: 0.34.1
    templatedValues:
      server:
        ingress:
          hosts:
            - host: "vault.{{ .Values.global.dnsName }}"
              paths: []
          tls:
            - secretName: vault-tls
              hosts:
                - "vault.{{ .Values.global.dnsName }}"

  # Vault Secrets Operator. Chosen over External Secrets for the Vault path
  # because the target use case is DYNAMIC database credentials: VSO renews
  # leases, revokes them on delete, and can roll a Deployment when creds
  # rotate. ESO re-reads on an interval and does none of that, so it leaks a
  # lease on every refresh. external-secrets stays enabled for static,
  # provider-agnostic secrets - see the README for the boundary.
  vault-secrets-operator:
    enabled: true
    wave: 0
    namespace: vault-secrets-operator
    helm:
      - repoURL: https://helm.releases.hashicorp.com
        targetRevision: 2.0.0

# =============================================================================
# apps - plain git-path Applications
# =============================================================================
# Manifests Argo CD applies directly (kustomize or raw YAML) rather than Helm
# charts. Same catalog/overlay rules as `charts` above: declare it here, toggle
# `enabled` per environment. See templates/apps.yaml for the full key list.
#
# These replace the hand-written Application manifests that used to live in
# declarative/root/, so the single root app now owns them too.
# =============================================================================

apps:
  # Autoscaling demo: Deployment + Service + HPA.
  php-apache:
    enabled: true
    wave: 2
    path: declarative/apps/php-apache
    namespace: default
    project: default

  # Blogging platform used as a plain-manifest example.
  ghost:
    enabled: true
    wave: 2
    path: declarative/apps/ghost
    namespace: default
    project: default

  # Kyverno ClusterPolicies. Scoped to `tenant-*` namespaces, so enabling this
  # does not affect php-apache or ghost in `default`. Needs the kyverno chart
  # above to be enabled first (its CRDs must exist).
  kyverno-policy:
    enabled: false
    wave: 2
  # The Vault -> VSO -> Secret -> pod chain, end to end and visible: a
  # ServiceAccount, the VaultAuth that authenticates as it, a VaultStaticSecret
  # over KV v2, and a tiny app that displays the delivered value BOTH from a
  # mounted file (updates on rotation) and from an env var (does not). See
  # declarative/apps/vault-demo/deployment.yaml for why that contrast matters.
  #
  # Wave 4: after vault (3) and vault-secrets-operator (0).
  # autosync off: it cannot succeed until the Vault Kubernetes auth role exists,
  # and a Degraded app sitting in the UI until then is just noise. Sync it by
  # hand once, after the Vault setup in myLab/README.md step 11.
  vault-demo:
    enabled: true
    wave: 4
    autosync_enabled: false
    path: declarative/apps/vault-demo
    namespace: vault-demo
    project: default

  # ServiceMonitors for the Argo CD metrics Services. These live here rather
  # than in the Argo CD Helm release because Ansible installs Argo CD before
  # Argo CD installs kube-prometheus-stack - so the ServiceMonitor CRD does not
  # exist yet at that point. Wave 2 puts them after kps (wave 1).
  monitoring-extras:
    enabled: true
    wave: 2
    path: declarative/apps/monitoring-extras
    namespace: monitoring
    project: default
