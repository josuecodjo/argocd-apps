{{- /* COLLISION GUARD - runs on every render, before anything is emitted.

   The ApplicationSet passes the cluster it is rendering for. If that disagrees
   with clusterName (which comes from values-<cluster>.yaml), then that file is
   missing or belongs to a different cluster - and appNameSuffix is therefore the
   catalog default "", which names every child Application exactly as the hub's
   are. Two root apps would then fight over the same objects, which is the
   failure this whole suffix scheme exists to prevent. Refuse to render instead.

   An empty renderedForCluster means a local `helm template`, where there is no
   cluster to check against, so the guard is inert and local rendering is
   unchanged. Only the ApplicationSet sets it. */}}
{{- if and .Values.renderedForCluster (ne .Values.renderedForCluster .Values.clusterName) }}
{{-   fail (printf "base-apps: refusing to render for cluster %q because clusterName is %q. Create base-apps/values-%s.yaml with `clusterName: %s` and `appNameSuffix: \"-%s\"` (only the hub keeps appNameSuffix empty). Without it every child Application would be named identically to the hub's and the two root apps would fight over them."
        .Values.renderedForCluster .Values.clusterName
        .Values.renderedForCluster .Values.renderedForCluster .Values.renderedForCluster) }}
{{- end }}
{{- range $appName, $app := .Values.charts }}
{{- if $app.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- /* appNameSuffix is "" on the hub, so its Application names are
       unchanged. Spokes set it (e.g. "-dev") so their Applications do
       not collide with the hub's in the shared argocd namespace. */}}
  name: {{ $appName }}{{ $.Values.appNameSuffix | default "" }}
  namespace: {{ $.Values.argocd_namespace }}
  {{/* Sync wave. hasKey rather than a truthiness test, so an explicit
       `wave: 0` is still emitted instead of being silently dropped. */}}
  {{- if hasKey $app "wave" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.wave | quote }}
  {{- end }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  sources:
    {{- range $repo := $app.helm }}
    {{- if $repo.localChart }}
    {{/* Local chart: lives in this repo, so it tracks the root app's revision by default. */}}
    - path: app_charts/{{ $app.chartName | default $appName }}
      repoURL: {{ $.Values.spec.source.repoURL }}
      targetRevision: {{ $repo.targetRevision | default $.Values.spec.source.targetRevision }}
    {{- else}}
    - chart: {{ $app.chartName | default $appName }}
      repoURL: {{ $repo.repoURL }}
      targetRevision: {{ $repo.targetRevision }}
    {{- end }}
      helm:
        valueFiles:
          {{- if not $repo.valuesFilePath }}
          - $values/base-apps/app_charts/{{ $app.chartName | default $appName }}/values.yaml
          {{- else }}
          - $values/base-apps/app_charts/{{ $app.chartName | default $appName }}/{{ $repo.valuesFilePath }}/values.yaml
          {{- end }}
        {{/* extraValues is passed through verbatim. templatedValues is rendered
             with `tpl` first, so it can reference values such as
             {{ .Values.global.dnsName }}. Keep anything containing literal Go
             template syntax (alert templates, Falco rules) in extraValues. */}}
        {{- $vals := $app.extraValues | default dict }}
        {{- if $app.templatedValues }}
        {{- $rendered := tpl ($app.templatedValues | toYaml) $ | fromYaml }}
        {{- $vals = mustMergeOverwrite (deepCopy $vals) $rendered }}
        {{- end }}
        {{- if $vals }}
        valuesObject:
          {{- $vals | toYaml | nindent 10 }}
        {{- end }}
      {{- end }}
    {{/* Values-only source. A `ref` source must not set `path`, otherwise Argo CD
         would also render this chart from it and duplicate every child app. */}}
    - repoURL: {{ $.Values.spec.source.repoURL }}
      targetRevision: {{ $.Values.spec.source.targetRevision }}
      ref: values
  destination:
    namespace: {{ $app.namespace | default $.Values.dest_namespace }}
    server: {{ $.Values.spec.destination.server }}
  project: {{ $app.project | default $.Values.dest_project }}
  {{- include "base-apps.syncPolicy" (dict "app" $app) | nindent 2 }}
{{- end }}
{{- end }}
