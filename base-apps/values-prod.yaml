---
# =============================================================================
# prod overlay - OVERRIDES ONLY
# =============================================================================
# Layered on top of values.yaml; see that file for the full catalog and for
# the list-replacement caveat when pinning a per-environment chart version.
#
#   helm template base-apps -f base-apps/values.yaml -f base-apps/values-prod.yaml
#
# Keep this file to actual differences. Anything absent here is inherited.
# =============================================================================

charts:
  # Security & policy stack is on in every environment today.
  external-secrets:
    enabled: true
  kyverno:
    enabled: true
  policy-reporter:
    enabled: true
  falco:
    enabled: true
