---
grafana:
  # -- (bool) Enable Grafana
  enabled: true

  adminUser: admin
  adminPassword: admin

  ingress:
    # -- Create Ingress exposing Grafana
    enabled: true
    # -- Ingress class. NOTE the key is `ingressClassName`, not `className`:
    # the Grafana subchart uses the former, so `className` was silently ignored
    # and the rendered Ingress carried no class at all. It only worked because
    # traefik is the default IngressClass on this cluster.
    ingressClassName: "traefik"
    # -- Labels for the Ingress
    labels: {}
    # -- Annotations for the Ingress
    annotations:
      # kubernetes.io/ingress.class: traefik
      cert-manager.io/cluster-issuer: local-cluster-issuer
      cert-manager.io/propagation-timeout: "30s"
      cert-manager.io/polling-interval: "5s"
    # -- Ingress host list and TLS come from `templatedValues` in
    # base-apps/values.yaml, so the domain follows global.dnsName.
    path: /

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Extra datasources: the spoke clusters' Prometheus instances.
  #
  # This Grafana is the single pane of glass for every cluster. Each cluster keeps
  # its OWN Prometheus (so a network blip loses no data); this just reads them.
  # Series are told apart by the `cluster` external label, set per cluster from
  # `clusterName` in base-apps/values-<cluster>.yaml - the stock dashboards filter
  # on it, which is why every cluster needs a distinct value.
  #
  # Plain http is deliberate, not an oversight:
  #   * each cluster's cert-manager mints its own lab CA, so the hub would not
  #     trust a spoke's certificate without either sharing the CA or
  #     tlsSkipVerify;
  #   * Traefik here does not force HTTPS (verified: http://.../api/health -> 200);
  #   * the traffic is LAN-internal, same posture as the Prometheus ingress.
  # Revisit if a spoke ever leaves the LAN.
  #
  # NOTE this Grafana runs in a POD, so it resolves the spoke host through
  # CoreDNS, not the node's /etc/hosts. See myLab/04-ArgoCD/manual/coredns-custom.yaml.
  additionalDataSources:
    - name: Prometheus-dev
      type: prometheus
      access: proxy
      url: http://prometheus.dev.lab
      isDefault: false
      jsonData:
        timeInterval: 30s

# ---------------------------------------------------------------------------
# k3s compatibility
# ---------------------------------------------------------------------------
# k3s runs the control plane as a single binary, so these four Services simply
# do not exist in kube-system (verified on this cluster). The chart enables all
# four by default, and the resulting ServiceMonitors sit permanently Down and
# fire KubeSchedulerDown / KubeControllerManagerDown / KubeProxyDown /
# etcdMembersDown forever - which makes the whole alerting surface useless.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# ---------------------------------------------------------------------------
# Prometheus
# ---------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 15GiB

    # The chart default is `storageSpec: {}`, which means emptyDir - every pod
    # restart would silently discard all history. Give it a real PVC.
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
