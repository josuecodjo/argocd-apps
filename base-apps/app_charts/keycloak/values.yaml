auth:
  adminUser: admin
  adminPassword: admin

service:
  type: ClusterIP

ingress:
  enabled: true
  # hostname and extraTls come from `templatedValues` in base-apps/values.yaml,
  # so the domain follows global.dnsName.
  annotations:
    # kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: local-cluster-issuer
    cert-manager.io/propagation-timeout: "30s"
    cert-manager.io/polling-interval: "5s"
  tls: true

postgresql:
  enabled: true
  auth:
    postgresPassword: keycloakpg
    password: keycloakpass

keycloakConfigCli:
  enabled: true
  configuration:
    example-realm.json: |
      {
        "realm": "example-realm",
        "enabled": true,
        "registrationAllowed": true,
        "users": [
          {
            "username": "basicuser",
            "email": "basicuser@example.com",
            "enabled": true,
            "firstName": "Basic",
            "lastName": "User",
            "credentials": [
              {
                "type": "password",
                "value": "basicpassword"
              }
            ]
          }
        ],
        "groups": [
          {
            "name": "basicgroup"
          }
        ]
      }
