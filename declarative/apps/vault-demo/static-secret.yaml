---
# Vault KV v2 -> a native Kubernetes Secret.
#
# `mount` and `path` are split: for KV v2 at secret/demo, mount is "secret" and
# path is "demo" - VSO inserts the /data/ segment itself. `type: kv-v2` is
# required (there is a kv-v1 too, which addresses paths differently).
#
# refreshAfter is what drives the rotation demo: VSO re-reads Vault on this
# interval and updates the Secret, which the kubelet then propagates into the
# mounted file. 30s keeps the demo snappy; production would be minutes.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-demo
  namespace: vault-demo
spec:
  type: kv-v2
  mount: secret
  path: demo
  refreshAfter: 30s
  vaultAuthRef: vault-demo
  destination:
    create: true
    name: vault-demo-creds
