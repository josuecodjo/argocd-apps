---
# The identity Vault authenticates. Nothing is stored anywhere: Vault validates
# this ServiceAccount's projected token via TokenReview (which is why the Vault
# chart's server.authDelegator must stay enabled) and maps it to a policy.
#
# This is why Kubernetes auth beats AppRole here - AppRole would need a
# role-id/secret-id pair planted in the cluster first, i.e. a secret in order to
# fetch secrets.
#
# The Vault role must bind BOTH this name and this namespace:
#   bound_service_account_names=vault-demo
#   bound_service_account_namespaces=vault-demo
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-demo
  namespace: vault-demo
