---
# The identity VSO presents to Vault. Vault's Kubernetes auth method validates
# this ServiceAccount's token via TokenReview (which is why the Vault chart's
# server.authDelegator must stay enabled), then maps it to the `vso-demo` role.
#
# No Secret or token is stored anywhere: that is the whole point of Kubernetes
# auth over AppRole, which would need a role-id/secret-id pair bootstrapped into
# the cluster first - a secret needed to fetch secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-demo
  namespace: vault-secrets-operator
