---
# THROWAWAY. This exists only to prove the chain end to end:
#   VaultAuth -> Kubernetes auth -> KV v2 read -> Kubernetes Secret
# Once `kubectl get secret vault-demo -o jsonpath='{.data.message}' | base64 -d`
# prints "hello", delete this file. It is scaffolding, not a fixture.
#
# The real target is a VaultDynamicSecret against the database engine, which
# adds lease renewal and rolloutRestartTargets - see the next step.
#
# `mount` + `path` are split: for KV v2 at secret/demo, mount is "secret" and
# path is "demo" (VSO adds the /data/ segment itself). type must be "kv-v2".
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-demo
  namespace: vault-secrets-operator
spec:
  type: kv-v2
  mount: secret
  path: demo
  refreshAfter: 30s
  vaultAuthRef: vault-demo
  destination:
    create: true
    name: vault-demo
