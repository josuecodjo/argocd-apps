---
# How VSO authenticates to Vault. `vaultConnectionRef` is omitted deliberately:
# the operator's Helm values set defaultVaultConnection, so every CR in the
# cluster inherits the address.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-demo
  namespace: vault-secrets-operator
spec:
  method: kubernetes
  mount: kubernetes          # the auth path: `vault auth enable kubernetes`
  kubernetes:
    role: vso-demo           # `vault write auth/kubernetes/role/vso-demo ...`
    serviceAccount: vault-demo
